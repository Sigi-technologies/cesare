<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giulio Cesare – Geomappa</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f2ee;--sea:#d4e2ea;--land:#e6e4d8;--line:#a9a58f;--river:#6f9bb0;--ink:#26272b;--mut:#6c6e73;--acc:#a3202f;--card:#fffefb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1c1f;--sea:#1f3039;--land:#34352f;--line:#55564b;--river:#5f8ea4;--ink:#ecebe6;--mut:#a0a2a6;--acc:#e5606e;--card:#26272b}}
:root[data-theme="dark"]{--bg:#1b1c1f;--sea:#1f3039;--land:#34352f;--line:#55564b;--river:#5f8ea4;--ink:#ecebe6;--mut:#a0a2a6;--acc:#e5606e;--card:#26272b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{padding:18px 20px 8px;max-width:1100px;margin:0 auto}
h1{font-size:clamp(22px,4vw,32px);margin:0;font-weight:700;letter-spacing:.01em}
header p{margin:4px 0 0;color:var(--mut);font-size:15px}
.mapw{position:relative;max-width:1100px;margin:8px auto 0;padding:0 12px}
svg{display:block;width:100%;height:auto;max-height:80vh;border:1px solid var(--line);border-radius:4px;touch-action:none;cursor:grab;background:var(--sea)}
.sea{fill:var(--sea)}
.land{fill:var(--land);stroke:var(--line);stroke-width:1;stroke-linejoin:round}
.wat{fill:var(--sea);stroke:var(--line);stroke-width:1;stroke-linejoin:round}
.river{fill:none;stroke:var(--river);stroke-width:1.6;stroke-linejoin:round}
.reg{font:italic 13px Georgia,serif;fill:var(--mut);letter-spacing:.14em;text-anchor:middle}
.zb{position:absolute;top:10px;right:22px;display:flex;flex-direction:column;gap:4px}
.zb button{width:34px;height:34px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:4px;font-size:18px;cursor:pointer}
.pt{cursor:pointer}
.halo{fill:var(--acc);opacity:.2}
.pt:hover .halo,.pt:focus-visible .halo{opacity:.45}
.pt:focus{outline:none}
.dot{fill:var(--acc);stroke:#fff;stroke-width:2}
.lbl{font:700 13px Georgia,serif;fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:3.5px;stroke-linejoin:round}
.hint{max-width:1100px;margin:8px auto 24px;padding:0 20px;color:var(--mut);font-size:13px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));z-index:20}
#ov[hidden]{display:none}
.card{position:relative;background:var(--card);color:var(--ink);width:100%;max-width:540px;max-height:100%;overflow:auto;border-radius:6px;border-top:4px solid var(--acc)}
#x{position:absolute;top:8px;right:8px;width:34px;height:34px;border:0;border-radius:50%;background:var(--card);color:var(--ink);font-size:22px;cursor:pointer;z-index:1}
#im img{display:block;width:100%;max-height:280px;object-fit:cover}
.ph{padding:36px 20px;text-align:center;color:var(--mut);font-size:14px;background:var(--land)}
#bd{padding:16px 20px 20px}
#bd h2{margin:0 0 8px;font-size:22px}
#bd p{margin:0 0 10px;max-width:62ch}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:10px}
input[type=text],textarea{display:block;width:100%;box-sizing:border-box;margin-top:4px;padding:8px;font:16px/1.5 Georgia,serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.b{display:inline-block;margin:0;padding:8px 14px;font:14px Georgia,serif;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:4px;cursor:pointer}
.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button:focus-visible,.b:focus-within{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<header>
<h1>Giulio Cesare: dalle Gallie alle idi di marzo</h1>
<p>Geomappa di Simone Gili 2A</p>
</header>
<div class="mapw">
<svg id="map" viewBox="0 0 960 756" role="img" aria-label="Mappa del Mediterraneo e dell’Europa occidentale con i luoghi di Cesare"></svg>
<div class="zb"><button id="zi" aria-label="Ingrandisci">+</button><button id="zo" aria-label="Riduci">−</button><button id="zr" aria-label="Vista intera">⟲</button></div>
</div>
<p class="hint"></p>

<div id="ov" hidden>
<div class="card" role="dialog" aria-modal="true" aria-labelledby="tt">
<button id="x" aria-label="Chiudi">×</button>
<div id="im"></div>
<div id="bd"></div>
</div>
</div>

<script>
/* ===== DATI: puoi modificare qui i testi iniziali (n = titolo, t = testo, img = immagine) ===== */
const D=[
{n:"Roma",lon:12.5,lat:41.9,s:"r",img:"https://images2-viaggi.corriereobjects.it/_uULC_jnzQucxLkXRvS0eTkvKzs=/1080x761/smart/filters:format(avif)/viaggi.corriere.it/assets/uploads/2023/06/7.-veduta-dell%E2%80%99area-sacra-min.jpg?v=1786006624",t:`Sera prima delle idi di marzo. Cesare ripensa al suo percorso, a tutte le sue campagne, a tutte le sue conquiste. Ma quella è una notte di cattici presagi infatti verrà assassinato il giorno dopo. Ricorda l’aneddoto di Alessandro Magno: «alla mia età aveva già conquistato il mondo intero».
Al ritorno trionfa a Roma, quasi l’incarnazione di un dio, e sfila con i suoi prigionieri. Il senato lo nomina dittatore a vita; Marco Antonio gli offre la corona d’alloro e Cesare la rifiuta tre volte. Prepara intanto una campagna contro i Parti. Viene ucciso, anche da Bruto, sotto la statua di Pompeo nella curia.`},
{n:"Monte Morto",lon:4.08,lat:46.93,s:"l",img: "https://upload.wikimedia.org/wikipedia/commons/7/75/Italienische_Seite_des_Grossen_Sankt_Bernhard_%282469m%29.jpg?utm_source=it.wikipedia.org&utm_campaign=index&utm_content=original" ,t:`Primo grande scontro della campagna gallica: Cesare affronta gli Elvezi presso il Monte Morto.`},
{n:"Reno",lon:7.5,lat:50.43,s:"r",img:"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEg5vICVDyrzl2ih8TIMVYmCQJPFBezCe9EVrbyRX_sQ4DLB0oTjHhr66j2Wm0huE4-Vx4xeuFuwpbrDWTlVGkvl_WKX1HDJyIcCOh9fKaERklAxcj9efoNpETq-z64AU1M4HmRfaq4_Q6Y/s1600/ponte-cesare.jpg",t:`Cesare incontra Ariovisto; un soldato germanico colpisce un romano con una pietra e scoppia la guerra contro i Germani. Cesare li insegue fino al Reno: 80.000 morti e il confine del futuro impero.
Poi attraversa il fiume con un ponte di legno, opera dell’ingegneria di Vitruvio, semina il panico tra i Germani e torna indietro distruggendo il ponte. Non solo forza, ma anche genio.`},
{n:"Loira",lon:-1.55,lat:47.2,s:"r",img:"https://upload.wikimedia.org/wikipedia/commons/7/7e/Battaglia_Veneti_56_aC.png?utm_source=it.wikipedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled",t:`Cesare vuole andare in Britannia, come un esploratore verso una nuova frontiera (l’analogia con Armstrong). Per arrivarci fa costruire circa 80 navi sulle rive della Loira.`},
{n:"Manica",lon:-0.4,lat:50.0,s:"l",img:"https://warhistory.org/media/2024/01/Caesars-Naval-Campaign-against-the-Veneti.png",t:`Chi controlla la Manica? I Veneti, un popolo di galli sul mare, che ne hanno il monopolio commerciale. Cesare sarebbe stata la fine dei loro affari. Cesare prova a combatterli ma è fermato dalle maree, e i Veneti gli sfuggono con facilità.`},
{n:"Veneti",lon:-2.76,lat:47.66,s:"l",img:"https://i.ytimg.com/vi/zFGe6JMoZxQ/maxresdefault.jpg?sqp=-oaymwEmCIAKENAF8quKqQMa8AEB-AHUBoAC4AOKAgwIABABGHIgTygxMA8=&rs=AOn4CLDjEKmnvISET7emZeSH0gOB3LP3Tw",t:`Nello scontro navale i rostri romani non funzionano. I Romani inventano allora una falce di legno con la punta ricurva, che blocca le navi nemiche e trasforma il combattimento in uno scontro «a terra».
Segue la strage negli accampamenti dei Veneti, che spariscono dalla storia. A Roma si inizia a temere la potenza di Cesare, e c’è sdegno.`},
{n:"Scogliere della Britannia",lon:1.37,lat:51.12,s:"r",img:"https://sevensisterscliffs.com/static/61e999524510a730042c3f2b23f30e5f/b8a05/seven-sisters-cliffs-panorama-sea-united-kingdom.avif",t:`Cesare arriva alle scogliere della Britannia, un territorio sconosciuto. Sulle scogliere appaiono i Britanni. I Romani scendono sulla spiaggia e ne prendono possesso, ma le maree distruggono le navi.`},
{n:"Alesia",lon:4.5,lat:47.54,s:"r",img:"https://www.france-voyage.com/visuals/tourisme/sito-alesia-277-1_w600.webp",t:`I capi galli si riuniscono sotto Vercingetorige. Nella battaglia di Alesia Cesare vince e il re si arrende.`},
{n:"Rubicone",lon:12.42,lat:44.12,s:"r",img:"https://studiahumanitatispaideia.wordpress.com/wp-content/uploads/2014/01/peter-dennis-cesare-si-appresta-a-passare-il-rubicone.jpg",t:`Cesare arriva sul Rubicone e pronuncia «alea iacta est» (o «alea iacta esto»): il dado è tratto. Passando il fiume con le armi dà inizio alla guerra civile.`},
{n:"Farsalo",lon:22.38,lat:39.29,s:"r",img:"https://upload.wikimedia.org/wikipedia/commons/0/0d/View_of_the_Thessalian_plain_from_the_acropolis_of_ancient_Pharsalos.jpg?utm_source=it.wikipedia.org&utm_campaign=index&utm_content=original",t:`Cesare arriva a Roma ma non trova Pompeo, e lo raggiunge a Farsalo. Vince la battaglia perché ha con sé i veterani e sa come combattono i cavalieri nemici. Pompeo fugge in Egitto.`},
{n:"Egitto",lon:29.9,lat:31.2,s:"l",img:"https://jt1965blog.wordpress.com/wp-content/uploads/2019/09/20190927_202404.jpg",t:`Quando Pompeo arriva viene accolto da una delegazione che lo uccide, agli ordini del re Tolomeo, che già si rivolge a Cesare. Cesare incontra Cleopatra e subisce il suo fascino. Una guerra lo aspetta; nel frattempo Cleopatra dà alla luce Cesarione.`}
];

/* ===== MAPPA: lon/lat -> pixel (stessa proiezione per costa e punti) ===== */
const W=960,H=756,K="cesare-geomappa-v1";
const P=(lo,la)=>[(lo+10)*20.8,(55-la)*28];
const pl=s=>s.trim().split(/\s+/).map(p=>{const a=p.split(",").map(Number);return P(a[0],a[1]).map(v=>v.toFixed(1)).join(",")}).join(" ");
const MAIN="-13,28 -11,29 -9.8,30.4 -9.8,31.5 -8.5,33 -7.6,33.6 -6.8,34 -5.9,35.8 -4.5,35.2 -3,35.3 -1.5,35.2 -0.7,35.7 1,36.5 3,36.8 5.1,36.8 7.8,36.9 9.9,37.3 11,37 10.5,36.4 10.6,35.5 10.8,34.7 10.1,33.9 11,33.2 13.2,32.9 15.1,32.4 16.6,31.2 18,30.4 19.8,30.3 20.1,32.1 22.6,32.8 24,32.1 25.2,31.6 27.2,31.3 29.9,31.2 31.8,31.5 32.3,31.3 34.4,31.5 34.9,32.5 35.5,33.9 35.8,35.5 36,36.2 34.6,36.8 32.8,36 30.7,36.9 29.6,36.2 29.1,36.6 28.3,36.8 27.4,37 27.3,37.7 26.3,38.3 27,38.45 26.6,39.3 26.2,39.5 26.2,40 26.3,40.4 25.9,40.85 24.4,40.9 24.3,40.15 23.4,40.25 22.95,40.65 22.6,40.1 22.95,39.35 23.4,38.8 24,38.2 24,37.65 23.65,37.95 23,37.9 23.3,37.4 22.8,37.1 23.2,36.5 22.5,36.4 21.7,36.8 21.1,37.5 21.4,38.2 20.7,39 20,39.7 19.4,40.45 19.4,41.3 18.7,42.4 18.1,42.65 16.4,43.5 15.2,44.1 14.4,45.3 13.85,44.85 13.75,45.65 12.4,45.4 12.5,44.9 12.3,44.4 12.6,44.05 13.5,43.6 14.2,42.5 16.2,41.9 16.85,41.1 17.95,40.65 18.5,40.1 18.35,39.8 17.2,40.5 16.7,40.2 16.6,39.7 17.1,39.1 17.1,38.9 16.5,38.4 16.05,37.93 15.65,38.1 15.85,38.6 16.2,38.75 16,39.35 15.8,39.8 15.3,40 14.8,40.6 14.35,40.6 14.2,40.8 13.6,41.2 12.3,41.7 11.8,42.1 10.5,42.9 10.3,43.5 9.8,44.1 8.9,44.4 7.3,43.7 6,43.1 5.4,43.3 4.5,43.4 3,43.2 3.3,42.3 2.2,41.4 0.9,40.7 -0.3,39.5 0.2,38.7 -1,37.6 -2.2,36.7 -4.4,36.7 -5.4,36 -6.3,36.8 -7.4,37.2 -9,37 -9.5,38.7 -8.9,41.1 -8.8,42 -9.3,42.9 -8.9,43.5 -7.7,43.8 -4,43.5 -1.8,43.4 -1.3,44.5 -1.1,45.6 -1.2,46.2 -2.2,47.3 -3.4,47.7 -4.4,47.8 -4.8,48.4 -3.5,48.8 -2,48.6 -1.6,48.7 -1.6,49.3 -1.95,49.7 -1.3,49.7 -1.1,49.35 0.1,49.5 1.1,49.9 1.8,50.9 3.2,51.3 4,52 4.8,53 6.5,53.4 8.5,53.6 8.8,54 8.1,55.5 8.2,58 40,58 40,28";
const ISL=[
"-5.7,50.05 -5.2,49.96 -3.6,50.2 -2.45,50.55 -1.3,50.75 -0.1,50.8 0.25,50.75 0.97,50.9 1.37,51.12 1.43,51.38 0.9,51.5 1.3,51.8 1.75,52.5 1.75,52.7 0.4,52.95 0.3,53.3 0.1,53.6 -0.1,54.1 -1.2,54.6 -1.6,55.3 -2,56 -2,58 -6,58 -5.5,55 -3.4,54.9 -3,53.8 -3.1,53.4 -4.5,53.3 -4.7,52.8 -4.1,52.3 -5.3,51.9 -4.2,51.6 -3.2,51.45 -3,51.2 -4.5,51",
"-10.5,51.9 -9.5,51.5 -8,51.8 -6.4,52.2 -6.1,53 -6.1,54 -5.5,54.6 -5.9,56 -10.6,56 -10.4,54",
"12.4,37.8 13.4,38.2 15.6,38.3 15.1,37.5 15.3,37 15.1,36.7 14.3,37 13.5,37.2",
"8.2,41 9.2,41.2 9.5,40.9 9.7,40 9.6,39.2 9.1,39.2 8.4,39 8.4,40 8.3,40.6",
"9.4,43 9.55,42.2 9.4,41.4 9.2,41.4 8.6,41.9 8.6,42.4 9.3,42.7",
"23.6,35.3 24.5,35.4 26.3,35.2 26.2,35 24.5,34.9 23.5,35.2",
"32.3,35 32.9,35.4 34.6,35.7 34,34.9 33,34.6 32.3,34.7"];
const WAT=[
"29,41.2 28,41.9 27.5,42.5 27.9,43.2 28.6,44 29.7,45.2 30.5,46 30.7,46.5 32,46.4 33.5,46 33.7,44.4 35,45 37,45.3 37,41.3 36,41.4 35.1,42 33.5,42 31.5,41.2",
"9.9,56 9.9,54.8 10.9,54 12.1,54.2 14.2,53.9 16.5,54.5 18.6,54.4 21.1,55.2 21.5,57"];
const RIV=["9.3,47.6 7.6,47.6 7.8,48.6 8.3,50 7.5,50.43 6.95,50.95 6.1,51.8 4.5,51.9","4.1,44.9 4.1,46 3.15,47 1.9,47.9 0.7,47.4 -0.55,47.45 -1.55,47.2 -2.2,47.28","32.7,28 31.8,29.5 31.2,30.1 31.1,31 30.4,31.5"];
const REG=[["GALLIA",1,45.2],["GERMANIA",10.8,51.9],["BRITANNIA",-2,53],["ITALIA",10.6,44.7],["EGITTO",28,28.9],["Mar Mediterraneo",17.5,34.6],["Oceano Atlantico",-6.5,44.6]];

const svg=document.getElementById("map");
let h='<rect class="sea" width="960" height="756"/>';
h+=`<polygon class="land" points="${pl(MAIN)}"/>`;
ISL.forEach(s=>h+=`<polygon class="land" points="${pl(s)}"/>`);
WAT.forEach(s=>h+=`<polygon class="wat" points="${pl(s)}"/>`);
RIV.forEach(s=>h+=`<polyline class="river" points="${pl(s)}"/>`);
REG.forEach(r=>{const p=P(r[1],r[2]);h+=`<text class="reg" x="${p[0].toFixed(1)}" y="${p[1].toFixed(1)}">${r[0]}</text>`});
svg.innerHTML=h;

/* ===== PUNTI ===== */
const NS="http://www.w3.org/2000/svg";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let saved={};try{saved=JSON.parse(localStorage.getItem(K)||"{}")}catch(e){}
const get=i=>Object.assign({},D[i],saved[i]||{});
function persist(){try{localStorage.setItem(K,JSON.stringify(saved));return true}catch(e){alert("Salvataggio non riuscito: spazio del browser esaurito. Prova con immagini più piccole.");return false}}
let moved=false;
const pts=D.map((d,i)=>{
  const p=P(d.lon,d.lat),g=document.createElementNS(NS,"g");
  g.setAttribute("class","pt");g.setAttribute("tabindex","0");g.setAttribute("role","button");g.setAttribute("aria-label",d.n);
  const right=d.s==="r";
  g.innerHTML=`<circle class="halo" r="11"/><circle class="dot" r="5.5"/><text class="lbl" x="${right?12:-12}" y="4.5" text-anchor="${right?"start":"end"}"></text>`;
  g.querySelector("text").textContent=(i+1)+" "+get(i).n;
  g._x=p[0];g._y=p[1];
  g.addEventListener("click",()=>{if(!moved)openCard(i)});
  g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openCard(i)}});
  svg.appendChild(g);return g});

/* ===== ZOOM E SPOSTAMENTO ===== */
let vb={x:0,y:0,w:W,h:H};
function setVB(){
  vb.h=vb.w*H/W;vb.x=Math.max(0,Math.min(W-vb.w,vb.x));vb.y=Math.max(0,Math.min(H-vb.h,vb.y));
  svg.setAttribute("viewBox",vb.x+" "+vb.y+" "+vb.w+" "+vb.h);
  const s=vb.w/(svg.clientWidth||W);
  pts.forEach(g=>g.style.transform="translate("+g._x+"px,"+g._y+"px) scale("+s+")");
}
function zoom(f,cx,cy){
  cx=cx==null?.5:cx;cy=cy==null?.5:cy;
  const nw=Math.max(W/6,Math.min(W,vb.w/f));
  vb.x+=(vb.w-nw)*cx;vb.y+=(vb.h-nw*H/W)*cy;vb.w=nw;setVB();
}
document.getElementById("zi").onclick=()=>zoom(1.6);
document.getElementById("zo").onclick=()=>zoom(1/1.6);
document.getElementById("zr").onclick=()=>{vb={x:0,y:0,w:W,h:H};setVB()};
svg.addEventListener("wheel",e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoom(e.deltaY<0?1.25:.8,(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height)},{passive:false});
let drag=null;
svg.addEventListener("pointerdown",e=>{if(e.button!==0)return;drag={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y};moved=false});
window.addEventListener("pointermove",e=>{
  if(!drag)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(Math.abs(dx)+Math.abs(dy)>5)moved=true;
  if(moved){const k=vb.w/svg.clientWidth;vb.x=drag.vx-dx*k;vb.y=drag.vy-dy*k;setVB()}
});
window.addEventListener("pointerup",()=>{drag=null;setTimeout(()=>{moved=false},0)});
window.addEventListener("resize",setVB);
setVB();

/* ===== SCHEDA (popup) ===== */
const $=s=>document.querySelector(s);
let cur=0,draft="";
function openCard(i){cur=i;view();$("#ov").hidden=false;$("#x").focus()}
function closeCard(){$("#ov").hidden=true}
function showImg(src){$("#im").innerHTML=src?'<img src="'+src+'" alt="">':'<div class="ph">Nessuna immagine. Premi «Modifica» per caricarne una.</div>'}
function view(){
  const d=get(cur);showImg(d.img);
  $("#tt")&&0;
  $("#bd").innerHTML='<h2 id="tt">'+(cur+1)+". "+esc(d.n)+"</h2>"+d.t.split(/\n+/).map(p=>"<p>"+esc(p)+"</p>").join("")+'<div class="row"><button class="b" id="be">✎ Modifica</button></div>';
  $("#be").onclick=edit;
}
function edit(){
  const d=get(cur);draft=d.img||"";
  $("#bd").innerHTML='<label>Titolo<input type="text" id="et" value="'+esc(d.n)+'"></label><label>Testo<textarea id="ex" rows="9">'+esc(d.t)+'</textarea></label><div class="row"><label class="b" style="margin:0">Scegli immagine…<input type="file" id="ef" accept="image/*" hidden></label><button class="b" id="er">Rimuovi immagine</button></div><div class="row"><button class="b pri" id="es">Salva</button><button class="b" id="ec">Annulla</button><button class="b" id="eo">Ripristina originale</button></div>';
  $("#ef").onchange=e=>{const f=e.target.files[0];if(f)toData(f).then(u=>{draft=u;showImg(draft)}).catch(()=>alert("Immagine non leggibile."))};
  $("#er").onclick=()=>{draft="";showImg("")};
  $("#es").onclick=()=>{saved[cur]={n:$("#et").value.trim()||D[cur].n,t:$("#ex").value,img:draft};if(persist()){relabel();view()}};
  $("#ec").onclick=view;
  $("#eo").onclick=()=>{delete saved[cur];if(persist()){relabel();view()}};
}
function relabel(){pts[cur].querySelector("text").textContent=(cur+1)+" "+get(cur).n}
function toData(f){return new Promise((ok,ko)=>{const r=new FileReader();r.onerror=ko;r.onload=()=>{const im=new Image();im.onerror=ko;im.onload=()=>{const k=Math.min(1,1500/im.width),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.82))};im.src=r.result};r.readAsDataURL(f)})}
$("#x").onclick=closeCard;
$("#ov").addEventListener("click",e=>{if(e.target.id==="ov")closeCard()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeCard()});
</script>
</body>
</html>
